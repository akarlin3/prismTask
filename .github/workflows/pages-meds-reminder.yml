name: Deploy Meds Reminder to Pages

# Publishes the standalone `meds-reminder/` app to GitHub Pages so it can
# be opened on a phone over HTTPS (required for the Web Notifications API).
# The app is a single static file with no build step, so the folder is
# uploaded as-is and becomes the Pages site root.
#
# One-time setup: repo Settings -> Pages -> Source -> "GitHub Actions".
# After that, every push to `main` that touches meds-reminder/ redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'meds-reminder/**'
      - '.github/workflows/pages-meds-reminder.yml'
  workflow_dispatch:

# Least privilege for a Pages deploy via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload meds-reminder as the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: meds-reminder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
